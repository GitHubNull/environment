name: Maven Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整的 Git 历史记录用于生成日志

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Find generated JAR files
        id: find_jar
        run: |
          # 查找带时间戳的 fat JAR（文件名格式：environment-{version}_{yyyyMMdd_HHmm}.jar）
          TIMESTAMPED_JAR=$(ls target/environment-*_20*.jar 2>/dev/null | head -n 1)
          if [ -z "$TIMESTAMPED_JAR" ]; then
            echo "::error::No timestamped JAR file found in target directory"
            exit 1
          fi
          # 查找不带时间戳的 fat JAR（由 maven-antrun-plugin 复制生成）
          PLAIN_JAR="target/environment-${GITHUB_REF_NAME#v}.jar"
          if [ ! -f "$PLAIN_JAR" ]; then
            echo "::error::No plain JAR file found: $PLAIN_JAR"
            exit 1
          fi
          echo "TIMESTAMPED_JAR=$TIMESTAMPED_JAR" >> $GITHUB_ENV
          echo "PLAIN_JAR=$PLAIN_JAR" >> $GITHUB_ENV

      - name: Generate Release Notes
        id: generate_release_notes
        run: |
          # 获取当前标签名称
          CURRENT_TAG=${{ github.ref_name }}

          # 获取前一个标签（如果存在）
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${CURRENT_TAG}^ 2>/dev/null || echo "")

          # 生成提交日志
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMIT_LOG=$(git log --pretty=format:'- %s (%h)')
          else
            COMMIT_LOG=$(git log ${PREVIOUS_TAG}..${CURRENT_TAG} --pretty=format:'- %s (%h)')
          fi

          # 写入文件（使用 Markdown 格式并保留换行）
          {
            echo "## 版本 $CURRENT_TAG 发布说明"
            echo ""
            echo "本次更新包含以下变更："
            echo ""
            echo "$COMMIT_LOG"
            echo ""
            echo "> 由 GitHub Actions 自动生成"
          } > release_notes.md

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            ${{ env.PLAIN_JAR }}
            ${{ env.TIMESTAMPED_JAR }}